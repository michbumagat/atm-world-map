    const markers = L.markerClusterGroup({maxClusterRadius:40, spiderfyOnMaxZoom:true});
    
    data.features.forEach((ft) => {
        const coords = ft.geometry.coordinates;
        const props = ft.properties;
        
        const marker = L.marker([coords[1], coords[0]]);
        
        let rows = '';
        for (const [k,v] of Object.entries(props)) {
            if (v === null || v === '' || k==='latitude' || k==='longitude' || k==='full_address') continue;
            rows += `<div class="row"><span class="label">${k}</span><span class="value">${v}</span></div>`;
        }
        
        const popupContent = `
        <div class="popup">
            <div class="header">ATM Details</div>
            <div class="body">${rows}</div>
        </div>`;
        
        marker.bindPopup(popupContent, {maxWidth:300});
        markers.addLayer(marker);
    });
    
    map.addLayer(markers);
    if (markers.getBounds().isValid()) {
